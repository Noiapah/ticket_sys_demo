spring.application.name=Telefonhjelp
server.address=127.0.0.1
server.port=0
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-connections=32
server.tomcat.threads.max=16
server.tomcat.accept-count=16
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=8KB
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
logging.file.name=${PHONE_SUPPORT_LOG:${java.io.tmpdir}/telefonhjelp.log}
logging.level.root=WARN
logging.level.no.telefonhjelp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.boot=WARN
